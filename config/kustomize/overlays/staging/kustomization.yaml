apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example only. Production-shaped but smaller, for pre-release qualification.
# Image digests are deliberately left as RELEASE_DIGEST_REQUIRED: pin them to a
# signed release digest at deploy time.
namespace: deliberation-cell-staging

resources:
  - ../../base

replicas:
  - { name: deliberation-api, count: 2 }
  - { name: deliberation-worker, count: 2 }
  - { name: deliberation-web, count: 2 }

patches:
  # Identify the cell this namespace and its private-dependency egress belong to.
  - target: { kind: Namespace }
    patch: |-
      - op: replace
        path: /metadata/labels/deliberation.io~1cell-id
        value: staging-cell-1
  - target: { kind: NetworkPolicy, name: allow-private-cell-dependencies }
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/namespaceSelector/matchLabels/deliberation.io~1cell-private-dependencies
        value: staging-cell-1

  # Two replicas leave no spare capacity for a voluntary disruption of two pods.
  - target: { kind: PodDisruptionBudget, name: deliberation-api }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: deliberation-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 8

  - target: { kind: Deployment, name: deliberation-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 256Mi }
          limits: { cpu: "1", memory: 1Gi }
  - target: { kind: Deployment, name: deliberation-worker }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }

  - target: { kind: ResourceQuota, name: cell-quota }
    patch: |-
      - op: replace
        path: /spec/hard
        value:
          requests.cpu: "8"
          requests.memory: 16Gi
          limits.cpu: "16"
          limits.memory: 32Gi
