apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize refuses to load resource files from outside a kustomization root,
# so the canonical manifests are collected here and consumed as a directory
# base by config/kustomize/base. This file adds no transformations.
resources:
  - cell-foundation.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - web-deployment.yaml
