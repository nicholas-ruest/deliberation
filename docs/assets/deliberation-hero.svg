<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Deliberation Platform</title>
  <desc id="desc">Evidence streams converge through governed evaluation while human authority remains at the center.</desc>
  <defs>
