      <stop offset="0.55" stop-color="#102d49"/>
      <stop offset="1" stop-color="#0b3b3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f2"/>
      <stop offset="1" stop-color="#9bf6c3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="420" rx="22" fill="url(#bg)"/>
  <g opacity=".13" stroke="#b8e8ef">
    <path d="M0 72H1440M0 144H1440M0 216H1440M0 288H1440M0 360H1440"/>
