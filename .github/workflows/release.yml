name: release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        component: [api, web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Enforce semantic version and release-tag agreement
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            RELEASE_TAG="$REF_NAME" npm run version:check
          else
            npm run version:check
          fi

      - name: Resolve image reference and tags
        id: reference
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/deliberation-${COMPONENT}"
          if [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
            tags="${image}:${version},${image}:latest"
          else
            version="v$(node -p "require('./package.json').version")"
            tags="${image}:${version}"
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build distributable output
        run: npm run build

      - name: Generate runtime dependency SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          provenance: true
          tags: ${{ steps.reference.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.reference.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attach SBOM attestation
        env:
          DIGEST_REFERENCE: ${{ steps.reference.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$DIGEST_REFERENCE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$DIGEST_REFERENCE"

      - name: Record release digest
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST_REFERENCE: ${{ steps.reference.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s %s\n' "$COMPONENT" "$DIGEST_REFERENCE" > "release-digest-${COMPONENT}.txt"
          printf -- '- `%s`: `%s`\n' "$COMPONENT" "$DIGEST_REFERENCE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifact-${{ matrix.component }}
          path: |
            release-digest-${{ matrix.component }}.txt
            sbom.cdx.json
